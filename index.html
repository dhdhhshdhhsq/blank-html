<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f0a1f" />
<title>سورپرایز ✨</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   ۱) متغیرها و ریست
   ============================================================ */
:root{
  --primary:#ff6ea9;
  --secondary:#a06bff;
  --accent:#ffd76e;
  --text:#ffffff;
  --muted:rgba(255,255,255,.72);
  --glass:rgba(255,255,255,.075);
  --glass-border:rgba(255,255,255,.16);
  --radius:26px;
  --shadow:0 24px 60px rgba(0,0,0,.42);
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; padding:0; }

body{
  font-family:'Vazirmatn', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
  color:var(--text);
  background:#0f0a1f;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

body::before{
  content:'';
  position:fixed; inset:-25%;
  background:
    radial-gradient(circle at 22% 18%, var(--glow1), transparent 52%),
    radial-gradient(circle at 78% 26%, var(--glow2), transparent 52%),
    radial-gradient(circle at 50% 95%, var(--glow3), transparent 55%);
  filter:blur(50px);
  animation:drift 26s ease-in-out infinite alternate;
  z-index:-2;
  pointer-events:none;
}
@keyframes drift{
  0%  { transform:translate3d(0,0,0) scale(1); }
  50% { transform:translate3d(2%,-3%,0) scale(1.06); }
  100%{ transform:translate3d(-3%,2%,0) scale(1.02); }
}

/* ============================================================
   ۲) بوم ذرات
   ============================================================ */
#fx{
  position:fixed; inset:0;
  width:100%; height:100%;
  z-index:0;
  pointer-events:none;
}

/* ============================================================
   ۳) سیستم صفحه‌ها
   ============================================================ */
.screen{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  padding:24px 18px;
  opacity:0; visibility:hidden;
  transform:translateY(18px) scale(.985);
  transition:opacity .65s cubic-bezier(.2,.7,.3,1),
             transform .65s cubic-bezier(.2,.7,.3,1),
             visibility .65s;
  overflow-y:auto;
  overflow-x:hidden;
  z-index:2;
  -webkit-overflow-scrolling:touch;
}
.screen.active{ opacity:1; visibility:visible; transform:none; }

/* ============================================================
   ۴) شیشه‌ای
   ============================================================ */
.glass{
  background:var(--glass);
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  border:1px solid var(--glass-border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

/* ============================================================
   ۵) صفحه ورود
   ============================================================ */
#screen-entry .hero{
  max-width:520px; width:100%;
  padding:52px 32px 44px;
  text-align:center;
  animation:heroIn 1s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes heroIn{
  from{ opacity:0; transform:translateY(34px) scale(.95); }
  to  { opacity:1; transform:none; }
}

.badge{
  display:inline-block;
  padding:7px 18px;
  border-radius:999px;
  font-size:.82rem;
  font-weight:500;
  letter-spacing:.2px;
  color:var(--accent);
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.14);
  margin-bottom:22px;
}

.hero-title{
  font-size:clamp(2rem, 8vw, 2.9rem);
  font-weight:800;
  margin:0 0 12px;
  line-height:1.35;
  background:linear-gradient(120deg, #fff 10%, var(--accent) 45%, var(--primary) 75%, #fff 100%);
  background-size:220% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:shimmer 6s linear infinite;
}
@keyframes shimmer{ to{ background-position:220% center; } }

.hero-sub{
  color:var(--muted);
  font-size:1rem;
  line-height:2;
  margin:0 0 34px;
  font-weight:400;
}

/* ============================================================
   ۶) دکمه‌ها
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  padding:15px 36px;
  border:none; border-radius:999px;
  font-family:inherit; font-size:1rem; font-weight:700;
  color:#fff;
  background:linear-gradient(135deg, var(--primary), var(--secondary));
  box-shadow:0 14px 34px -8px var(--primary);
  cursor:pointer;
  transition:transform .28s cubic-bezier(.2,.8,.3,1),
             box-shadow .28s ease,
             filter .28s ease;
  will-change:transform;
}
.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 20px 44px -8px var(--primary);
  filter:brightness(1.07);
}
.btn:active{ transform:translateY(0) scale(.97); }
.btn:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

.btn-ghost{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:none;
  color:var(--text);
}
.btn-ghost:hover{
  background:rgba(255,255,255,.15);
  box-shadow:0 12px 30px rgba(0,0,0,.3);
}

.btn-row{
  display:flex; flex-wrap:wrap; gap:12px; justify-content:center;
  margin-top:26px;
}

/* ============================================================
   ۷) صفحه اسم
   ============================================================ */
#screen-name .name-card{
  max-width:440px; width:100%;
  padding:46px 30px 40px;
  text-align:center;
  animation:heroIn .9s cubic-bezier(.2,.8,.3,1) both;
}
.name-card h2{ font-size:1.5rem; font-weight:700; margin:0 0 10px; }
.name-card p{ color:var(--muted); font-size:.95rem; line-height:2; margin:0 0 28px; }

.input-wrap{ position:relative; margin-bottom:24px; }
.input-wrap input{
  width:100%;
  padding:16px 20px;
  font-family:inherit;
  font-size:1.05rem;
  font-weight:600;
  text-align:center;
  color:#fff;
  background:rgba(255,255,255,.07);
  border:1.5px solid rgba(255,255,255,.18);
  border-radius:18px;
  outline:none;
  transition:border-color .3s, box-shadow .3s, background .3s;
}
.input-wrap input::placeholder{ color:rgba(255,255,255,.34); font-weight:400; }
.input-wrap input:focus{
  border-color:var(--primary);
  background:rgba(255,255,255,.11);
  box-shadow:0 0 0 4px rgba(255,110,169,.16);
}
.input-wrap.shake{ animation:shake .45s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake{
  10%,90%{ transform:translateX(-2px); }
  20%,80%{ transform:translateX(4px); }
  30%,50%,70%{ transform:translateX(-7px); }
  40%,60%{ transform:translateX(7px); }
}

/* ============================================================
   ۸) خوش‌آمد
   ============================================================ */
#screen-welcome .welcome-card{
  max-width:560px; width:100%;
  padding:48px 32px;
  text-align:center;
}
#welcomeLines{ min-height:180px; display:flex; flex-direction:column; justify-content:center; gap:14px; }
.welcome-line{
  font-size:clamp(1.05rem, 4.2vw, 1.35rem);
  font-weight:600;
  line-height:2.1;
  margin:0;
  color:#fff;
  min-height:1.6em;
}
.welcome-line:first-child{
  font-size:clamp(1.3rem, 5.5vw, 1.8rem);
  font-weight:800;
  background:linear-gradient(120deg, #fff, var(--accent));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.cursor::after{
  content:'▍';
  color:var(--primary);
  animation:blink .85s steps(1) infinite;
  margin-inline-start:2px;
}
@keyframes blink{ 50%{ opacity:0; } }

.fade-up{
  opacity:0; transform:translateY(14px);
  transition:opacity .6s ease, transform .6s ease;
}
.fade-up.show{ opacity:1; transform:none; }

/* ============================================================
   ۹) کارت‌ها
   ============================================================ */
#screen-cards{ align-items:flex-start; padding-top:34px; padding-bottom:34px; }
.cards-wrap{
  width:100%; max-width:620px;
  margin:auto;
  display:flex; flex-direction:column; gap:18px;
}

.progress-track{
  height:5px; width:100%;
  background:rgba(255,255,255,.1);
  border-radius:999px;
  overflow:hidden;
}
.progress-fill{
  height:100%; width:20%;
  border-radius:999px;
  background:linear-gradient(90deg, var(--primary), var(--secondary));
  transition:width .55s cubic-bezier(.2,.8,.3,1);
}

.card{
  padding:34px 26px 30px;
  animation:cardIn .6s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes cardIn{
  from{ opacity:0; transform:translateY(26px) scale(.975); }
  to  { opacity:1; transform:none; }
}

.card-title{
  font-size:clamp(1.15rem, 4.6vw, 1.45rem);
  font-weight:800;
  margin:0 0 8px;
  line-height:1.75;
  background:linear-gradient(120deg, #fff, var(--accent));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.card-hint{ color:var(--muted); font-size:.9rem; margin:0 0 24px; line-height:1.9; }
.card-text{ font-size:1rem; line-height:2.15; color:rgba(255,255,255,.92); margin:0; }

.reasons-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
  gap:12px;
}
.reason{
  perspective:900px;
  height:104px;
  cursor:pointer;
  background:none; border:none; padding:0;
  font-family:inherit;
}
.reason-inner{
  position:relative; width:100%; height:100%;
  transition:transform .75s cubic-bezier(.2,.8,.3,1);
  transform-style:preserve-3d;
}
.reason.flipped .reason-inner{ transform:rotateY(180deg); }
.reason-face{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  padding:12px;
  border-radius:20px;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  text-align:center;
  font-size:.92rem;
  line-height:1.85;
  font-weight:600;
}
.reason-front{
  background:rgba(255,255,255,.07);
  border:1px dashed rgba(255,255,255,.24);
  color:var(--muted);
  font-size:1.6rem;
}
.reason-back{
  transform:rotateY(180deg);
  background:linear-gradient(135deg, rgba(255,110,169,.24), rgba(160,107,255,.24));
  border:1px solid rgba(255,255,255,.2);
  color:#fff;
}
.reason:focus-visible{ outline:2px solid var(--accent); outline-offset:4px; border-radius:20px; }

.memory-box{
  padding:22px 20px;
  border-radius:20px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.13);
  margin-bottom:6px;
}
.memory-title{ font-weight:700; font-size:1.02rem; margin:0 0 10px; color:var(--accent); }
.memory-text{ font-size:.97rem; line-height:2.15; color:rgba(255,255,255,.9); margin:0; }

.game-area{
  position:relative;
  height:270px;
  border-radius:22px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.11);
  overflow:hidden;
  margin-bottom:16px;
  touch-action:manipulation;
}
.game-heart{
  position:absolute;
  width:52px; height:52px;
  display:flex; align-items:center; justify-content:center;
  border:none; background:none; padding:0;
  cursor:pointer;
  color:var(--primary);
  filter:drop-shadow(0 4px 14px rgba(255,110,169,.55));
  animation:heartFloat .5s cubic-bezier(.2,1.6,.4,1) both,
            heartBob 2.4s ease-in-out infinite .5s;
  transition:transform .3s, opacity .3s;
}
.game-heart svg{ width:100%; height:100%; }
.game-heart:hover{ transform:scale(1.14); }
.game-heart.popped{
  transform:scale(1.9);
  opacity:0;
  transition:transform .35s cubic-bezier(.2,1.5,.4,1), opacity .35s;
}
.game-heart.gone{ opacity:0; transform:scale(.6); transition:opacity .4s, transform .4s; }
@keyframes heartFloat{
  from{ transform:scale(0) rotate(-25deg); opacity:0; }
  to  { transform:scale(1) rotate(0deg); opacity:1; }
}
@keyframes heartBob{
  0%,100%{ translate:0 0; }
  50%    { translate:0 -9px; }
}

.game-status{
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; font-size:.92rem; color:var(--muted); font-weight:500;
}
.game-counter{ font-weight:800; color:var(--accent); font-size:1.05rem; }

.envelope{
  position:relative;
  width:100%;
  padding:38px 22px;
  border-radius:22px;
  background:linear-gradient(150deg, rgba(255,110,169,.2), rgba(160,107,255,.2));
  border:1px solid rgba(255,255,255,.18);
  text-align:center;
  cursor:pointer;
  transition:transform .35s cubic-bezier(.2,.8,.3,1), box-shadow .35s;
  font-family:inherit; color:#fff;
  overflow:hidden;
}
.envelope:hover{ transform:translateY(-4px) scale(1.012); box-shadow:0 18px 44px -12px var(--secondary); }
.envelope-icon{ font-size:2.6rem; display:block; margin-bottom:12px; animation:wiggle 2.6s ease-in-out infinite; }
@keyframes wiggle{
  0%,100%{ transform:rotate(0deg); }
  25%{ transform:rotate(-7deg); }
  75%{ transform:rotate(7deg); }
}
.envelope-label{ font-size:.98rem; font-weight:700; }
.envelope-hint{ font-size:.83rem; color:var(--muted); margin-top:6px; font-weight:400; }

.hidden-message{
  max-height:0; opacity:0; overflow:hidden;
  transition:max-height .8s cubic-bezier(.2,.8,.3,1), opacity .6s ease .15s, margin .6s;
  margin-top:0;
}
.hidden-message.open{ max-height:600px; opacity:1; margin-top:20px; }
.hidden-message .card-text{
  padding:22px 20px;
  border-radius:20px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.13);
}

.gift-box{
  width:150px; height:150px;
  margin:8px auto 22px;
  display:flex; align-items:center; justify-content:center;
  font-size:5rem;
  cursor:pointer;
  border-radius:34px;
  background:linear-gradient(145deg, rgba(255,110,169,.26), rgba(160,107,255,.26));
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 20px 50px -18px var(--primary);
  transition:transform .4s cubic-bezier(.2,.8,.3,1), box-shadow .4s;
  user-select:none;
  animation:giftPulse 2.6s ease-in-out infinite;
  font-family:inherit;
  color:#fff;
}
@keyframes giftPulse{
  0%,100%{ transform:scale(1) rotate(0deg); }
  8%     { transform:scale(1.05) rotate(-5deg); }
  16%    { transform:scale(1.05) rotate(5deg); }
  24%    { transform:scale(1) rotate(0deg); }
}
.gift-box:hover{ box-shadow:0 26px 60px -16px var(--primary); }
.gift-box.opened{ animation:none; transform:scale(1.12); }

/* ============================================================
   ۱۰) صفحه پایانی
   ============================================================ */
#screen-final .final-card{
  max-width:580px; width:100%;
  padding:50px 32px 42px;
  text-align:center;
  animation:heroIn .9s cubic-bezier(.2,.8,.3,1) both;
}
.final-emoji{
  font-size:3.4rem; display:block; margin-bottom:14px;
  animation:bounceIn 1.1s cubic-bezier(.2,1.5,.4,1) both;
}
@keyframes bounceIn{
  0%  { transform:scale(0) rotate(-40deg); opacity:0; }
  60% { transform:scale(1.25) rotate(8deg); opacity:1; }
  100%{ transform:scale(1) rotate(0); }
}
.final-title{
  font-size:clamp(1.4rem, 5.6vw, 1.9rem);
  font-weight:800;
  margin:0 0 18px;
  line-height:1.7;
  background:linear-gradient(120deg, #fff, var(--accent), var(--primary));
  background-size:200% auto;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:shimmer 5s linear infinite;
}
.final-text{ font-size:1.02rem; line-height:2.2; color:rgba(255,255,255,.92); margin:0 0 12px; }
.final-sign{ font-size:.92rem; color:var(--muted); margin:20px 0 0; line-height:2; }
.final-sign strong{ color:var(--accent); font-weight:700; }

/* ============================================================
   ۱۱) دکمه‌های شناور (موسیقی / صدا) و توست
   ============================================================ */
.float-btn{
  position:fixed;
  top:16px;
  z-index:60;
  width:46px; height:46px;
  display:none;
  align-items:center; justify-content:center;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  color:#fff;
  cursor:pointer;
  transition:transform .3s, background .3s;
}
.float-btn:hover{ transform:scale(1.08); background:rgba(255,255,255,.16); }
.float-btn svg{ width:20px; height:20px; }
.float-btn.active{ color:var(--accent); }
.float-btn .spin{ animation:spin 3.4s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

#musicBtn{ left:16px; }
#soundBtn{ right:16px; display:flex; }   /* دکمهٔ صدا همیشه دیده می‌شود */
#soundBtn.muted{ color:rgba(255,255,255,.42); }

#toast{
  position:fixed;
  bottom:28px; left:50%;
  transform:translate(-50%, 26px);
  z-index:80;
  padding:13px 26px;
  border-radius:999px;
  background:rgba(20,14,38,.92);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  color:#fff;
  font-size:.9rem;
  font-weight:600;
  opacity:0;
  pointer-events:none;
  transition:opacity .4s ease, transform .4s cubic-bezier(.2,.8,.3,1);
  white-space:nowrap;
  max-width:90vw;
  overflow:hidden;
  text-overflow:ellipsis;
}
#toast.show{ opacity:1; transform:translate(-50%, 0); }

/* ============================================================
   ۱۲) ریسپانسیو
   ============================================================ */
@media (max-width:480px){
  .screen{ padding:18px 14px; }
  #screen-entry .hero{ padding:42px 22px 36px; }
  .card{ padding:28px 20px 26px; }
  .reasons-grid{ grid-template-columns:1fr 1fr; gap:10px; }
  .reason{ height:96px; }
  .reason-face{ font-size:.85rem; }
  .game-area{ height:230px; }
  .gift-box{ width:126px; height:126px; font-size:4.2rem; }
  .btn{ padding:14px 28px; font-size:.95rem; width:100%; }
  .btn-row{ flex-direction:column; }
}

@media (min-width:900px){ .game-area{ height:300px; } }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}
</style>
</head>

<body>

<canvas id="fx" aria-hidden="true"></canvas>

<!-- دکمه موسیقی -->
<button id="musicBtn" class="float-btn" aria-label="پخش یا توقف موسیقی" title="موسیقی">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M9 18V5l12-2v13"/>
    <circle cx="6" cy="18" r="3"/>
    <circle cx="18" cy="16" r="3"/>
  </svg>
</button>

<!-- دکمه صدا (۳بعدی) -->
<button id="soundBtn" class="float-btn active" aria-label="روشن/خاموش کردن صداهای سه‌بعدی" title="صدای سه‌بعدی">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M11 5 6 9H2v6h4l5 4V5z"/>
    <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
    <path d="M19 5a9 9 0 0 1 0 14"/>
  </svg>
</button>

<!-- ============ صفحه ۱: ورود ============ -->
<section class="screen active" id="screen-entry">
  <div class="hero glass">
    <span class="badge" id="occasionBadge">✨ یک سورپرایز کوچیک</span>
    <h1 class="hero-title">یه چیزی برات آماده کردم</h1>
    <p class="hero-sub">
      چند تا کارت کوچیک، یه خاطره، یه چالش بامزه<br />
      و یه پیام که شاید دوستش داشته باشی 🌸
    </p>
    <button class="btn" id="startBtn">
      یه سورپرایز برات دارم
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M12 21s-7.5-4.6-9.6-9.2C.7 8.3 2.6 4.5 6.3 4.5c2.1 0 3.6 1.2 4.4 2.4.8-1.2 2.3-2.4 4.4-2.4 3.7 0 5.6 3.8 3.9 7.3C19.5 16.4 12 21 12 21z"/>
      </svg>
    </button>
  </div>
</section>

<!-- ============ صفحه ۲: اسم ============ -->
<section class="screen" id="screen-name">
  <div class="name-card glass">
    <h2>اول یه سؤال کوچیک 🌷</h2>
    <p>اسمت رو بنویس تا این سورپرایز به اسم خودت بشه.</p>
    <div class="input-wrap" id="nameWrap">
      <input type="text" id="nameInput" placeholder="مثلاً: مریم"
             autocomplete="given-name" maxlength="24" aria-label="نام شما" />
    </div>

/* ============================================================

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const sleep = ms => new Promise(r => setTimeout(r, ms));

    .replace(/\{name\}/g, state.name || "دوستِ خوبم")

function hexToRgba(hex, alpha) {
  let h = String(hex).replace("#", "").trim();
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  const num = parseInt(h, 16);
  if (Number.isNaN(num)) return `rgba(255,255,255,${alpha})`;
  return `rgba(${(num >> 16) & 255},${(num >> 8) & 255},${num & 255},${alpha})`;
}

let toastTimer = null;
function showToast(msg, dur = 2600) {
  const toast = $("#toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), dur);
}


/* ============================================================
   بخش ۳: وضعیت
   ============================================================ */
const STORAGE_KEY = "surprise_name_v1";

const state = {
  name: "",
  currentCard: 0,
  caughtHearts: 0,
  reducedMotion: window.matchMedia("(prefers-reduced-motion: reduce)").matches
};


/* ============================================================
   بخش ۴: تم
   ============================================================ */
function applyTheme() {

  const r = document.documentElement;
  r.style.setProperty("--primary",   c.primary   || "#ff6ea9");
  r.style.setProperty("--secondary", c.secondary || "#a06bff");

/* ============================================================
   بخش ۵: 🎧 سیستم صدای سه‌بعدی (Spatial Audio Engine)
   ============================================================
   - همهٔ صداها به‌صورت سنتز شده در مرورگر ساخته می‌شوند.
   - برای هر صدا یک PannerNode با مدل HRTF ساخته می‌شود تا حس
     سه‌بعدی واقعی (چپ/راست/جلو/عقب) داشته باشد.
   - مختصات صفحه (x, y) به فضای سه‌بعدی نگاشت می‌شود.
   ============================================================ */
const Audio3D = {
  ctx: null,
  master: null,
  noiseBuffer: null,
  ready: false,
  enabled: CONFIG.sound3D && CONFIG.sound3D.enabled !== false,
  volume: (CONFIG.sound3D && CONFIG.sound3D.volume) || 0.4,
  range: (CONFIG.sound3D && CONFIG.sound3D.spatialRange) || 1.6,
  useHRTF: (CONFIG.sound3D && CONFIG.sound3D.hrtf) !== false,

  /* ---- راه‌اندازی ---- */
  init() {
    if (this.ready || !this.enabled) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { this.enabled = false; return; }

    try {
      this.ctx = new Ctx();
    } catch (e) { this.enabled = false; return; }

    // Gain اصلی
    this.master = this.ctx.createGain();
    this.master.gain.value = this.volume;
    this.master.connect(this.ctx.destination);

    // راه‌اندازی Listener (گوش شنونده در مرکز صفحه)
    this._setupListener();

    // بافر نویز برای افکت‌های whoosh / sparkle
    this.noiseBuffer = this._makeNoiseBuffer(2);

    this.ready = true;
  },

  _setupListener() {
    const l = this.ctx.listener;
    if (l.positionX) {
      // API جدید
      l.positionX.value = 0;
      l.positionY.value = 0;
      l.positionZ.value = 0;
      l.forwardX.value = 0;
      l.forwardY.value = 0;
      l.forwardZ.value = -1;
      l.upX.value = 0;
      l.upY.value = 1;
      l.upZ.value = 0;
    } else if (l.setPosition) {
      // API قدیمی
      l.setPosition(0, 0, 0);
      l.setOrientation(0, 0, -1, 0, 1, 0);
    }
  },

  _makeNoiseBuffer(seconds) {
    const rate = this.ctx.sampleRate;
    const len = Math.floor(rate * seconds);
    const buf = this.ctx.createBuffer(1, len, rate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  },

  /* ---- از سرگیری پس از تعامل کاربر ---- */
  resume() {
    if (!this.ready) this.init();
    if (this.ctx && this.ctx.state === "suspended") {
      this.ctx.resume().catch(() => {});
    }
  },

  /* ---- ساخت Panner در نقطهٔ (x, y, z) ---- */
  _panner(x = 0, y = 0, z = -1) {
    const p = this.ctx.createPanner();

    // مدل پنینگ
    if (this.useHRTF) {
      try { p.panningModel = "HRTF"; }
      catch (e) { p.panningModel = "equalpower"; }
    } else {
      p.panningModel = "equalpower";
    }

    p.distanceModel = "inverse";
    p.refDistance = 1;
    p.maxDistance = 30;
    p.rolloffFactor = 1.1;
    p.coneInnerAngle = 360;
    p.coneOuterAngle = 0;
    p.coneOuterGain = 0;

    if (p.positionX) {
      p.positionX.value = x;
      p.positionY.value = y;
      p.positionZ.value = z;
    } else if (p.setPosition) {
      p.setPosition(x, y, z);
    }
    return p;
  },

  /* ---- نگاشت مختصات صفحه به فضای سه‌بعدی ----
     x:  راست = مثبت،  چپ = منفی
     y:  بالا = مثبت،  پایین = منفی
     z:  جلوی شنونده = منفی (همیشه -1)
  ------------------------------------------- */
  screenTo3D(clientX, clientY) {
    const w = window.innerWidth  || 1;
    const h = window.innerHeight || 1;
    const nx = (clientX / w) * 2 - 1;      // -1 تا 1
    const ny = -((clientY / h) * 2 - 1);   // معکوس، چون Y صفحه برعکس است
    return {
      x: nx * this.range,
      y: ny * this.range * 0.75,           // کمی فشرده‌تر در محور عمودی
      z: -1 - Math.random() * 0.35         // کمی تنوع عمق
    };
  },

  /* ============================================================
     سنتز صداها
     ============================================================ */

  /** یک تن خالص با پوش (envelope) */
  _tone({ freq, freqEnd, dur = 0.2, type = "sine", gain = 0.15,
          attack = 0.008, release = 0.09, x = 0, y = 0, z = -1 }) {
    if (!this.ready) return;
    const t0 = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g   = this.ctx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (freqEnd) {
      osc.frequency.exponentialRampToValueAtTime(
        Math.max(20, freqEnd), t0 + dur
      );
    }

    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + release);

    const pan = this._panner(x, y, z);
    osc.connect(g).connect(pan).connect(this.master);

    osc.start(t0);
    osc.stop(t0 + dur + release + 0.05);
  },

  /** نویز فیلترشده (برای whoosh / sparkle) */
  _noise({ dur = 0.3, freq = 2000, freqEnd, Q = 1, gain = 0.12,
           type = "bandpass", x = 0, y = 0, z = -1 }) {
    if (!this.ready || !this.noiseBuffer) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer;
    src.loop = true;

    const filter = this.ctx.createBiquadFilter();
    filter.type = type;
    filter.frequency.setValueAtTime(freq, t0);
    filter.Q.value = Q;
    if (freqEnd) {
      filter.frequency.exponentialRampToValueAtTime(
        Math.max(40, freqEnd), t0 + dur
      );
    }

    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    const pan = this._panner(x, y, z);
    src.connect(filter).connect(g).connect(pan).connect(this.master);

    src.start(t0);
    src.stop(t0 + dur + 0.08);
  },

  /* ============================================================
     صداهای آماده (Preset) — هریک با موقعیت سه‌بعدی
     ============================================================ */

  /** کلیک نرم دکمه */
  click(clientX, clientY) {
    const p = clientX != null
      ? this.screenTo3D(clientX, clientY)
      : { x: 0, y: 0, z: -1 };
    this._tone({
      freq: 720, freqEnd: 520,
      dur: 0.05, type: "sine",
      gain: 0.07, attack: 0.004, release: 0.05,
      ...p
    });
  },

  /** چرخش کارت (کاغذ) */
  flip(clientX, clientY) {
    const p = clientX != null
      ? this.screenTo3D(clientX, clientY)
      : { x: 0, y: 0, z: -1 };
    // سوت کوتاه
    this._noise({
      dur: 0.14, freq: 3200, freqEnd: 1400, Q: 0.9,
      gain: 0.06, type: "bandpass", ...p
    });
    // تن زیر برای حس «کاغذ»
    this._tone({
      freq: 320, freqEnd: 220,
      dur: 0.11, type: "triangle",
      gain: 0.05, attack: 0.005, release: 0.06, ...p
    });
  },

  /** پاپ قلب (هنگام گرفتن) */
  heartPop(clientX, clientY) {
    const p = clientX != null
      ? this.screenTo3D(clientX, clientY)
      : { x: 0, y: 0, z: -1 };
    this._tone({
      freq: 320, freqEnd: 880,
      dur: 0.13, type: "sine",
      gain: 0.16, attack: 0.006, release: 0.09, ...p
    });
    // یک لایهٔ کوچک بالا برای «تیز»
    this._tone({
      freq: 1200, freqEnd: 1800,
      dur: 0.07, type: "sine",
      gain: 0.06, attack: 0.004, release: 0.05, ...p
    });
  },

  /** درخشش (باز شدن پاکت / پیام مخفی) */
  sparkle(clientX, clientY) {
    const base = clientX != null
      ? this.screenTo3D(clientX, clientY)
      : { x: 0, y: 0, z: -1 };
    const notes = [880, 1320, 1760, 2200];
    notes.forEach((f, i) => {
      setTimeout(() => {
        this._tone({
          freq: f, freqEnd: f * 1.15,
          dur: 0.12, type: "sine",
          gain: 0.08, attack: 0.005, release: 0.12,
          x: base.x + (i - 1.5) * 0.22,
          y: base.y + (Math.random() - 0.5) * 0.25,
          z: base.z
        });
      }, i * 55);
    });
  },

  /** وزوز عبور (کانفتی / هدیه) */
  whoosh() {
    this._noise({
      dur: 0.5, freq: 400, freqEnd: 3200, Q: 0.7,
      gain: 0.09, type: "bandpass",
      x: (Math.random() - 0.5) * 0.8, y: 0, z: -1.5
    });
  },

  /** آرپژ جشن (پایان / باز شدن هدیه) — چرخش صدا در فضا */
  celebration() {
    const notes = [
      { f: 523.25, x: -0.9, y:  0.4 },   // C5
      { f: 659.25, x: -0.3, y: -0.3 },   // E5
      { f: 783.99, x:  0.3, y:  0.4 },   // G5
      { f: 1046.5, x:  0.9, y: -0.2 },   // C6
      { f: 1318.5, x:  0.2, y:  0.5 },   // E6
      { f: 1567.9, x: -0.5, y: -0.4 }    // G6
    ];
    notes.forEach((n, i) => {
      setTimeout(() => {
        this._tone({
          freq: n.f, freqEnd: n.f * 1.02,
          dur: 0.4, type: "sine",
          gain: 0.11, attack: 0.008, release: 0.4,
          x: n.x * this.range * 0.6,
          y: n.y * this.range * 0.6,
          z: -1 - Math.random() * 0.5
        });
      }, i * 95);
    });
  },

  /** صدای بسیار نرم تایپ */
  typeTick() {
    if (!CONFIG.sound3D || !CONFIG.sound3D.typingSound) return;
    this._tone({
      freq: 1500 + Math.random() * 500,
      freqEnd: 900,
      dur: 0.012, type: "sine",
      gain: 0.035, attack: 0.002, release: 0.02,
      x: (Math.random() - 0.5) * 0.4,
      y: (Math.random() - 0.5) * 0.3,
      z: -0.8
    });
  },

  /** زنگ نرم ورود به صفحه */
  pageChime() {
    [659.25, 987.77].forEach((f, i) => {
      setTimeout(() => {
        this._tone({
          freq: f, freqEnd: f * 1.05,
          dur: 0.35, type: "sine",
          gain: 0.08, attack: 0.01, release: 0.5,
          x: -0.2 + i * 0.4, y: 0.2, z: -1.2
        });
      }, i * 110);
    });
  },

  /** به‌روزرسانی صدای کلی */
  setVolume(v) {
    this.volume = Math.max(0, Math.min(1, v));
    if (this.master) {
      this.master.gain.setTargetAtTime(
        this.volume, this.ctx.currentTime, 0.05
      );
    }
  }
};


/* ============================================================
   بخش ۶: موسیقی
   ============================================================ */
let audioEl = null;

function setupMusic() {
  if (!CONFIG.musicUrl) return;

  audioEl = new Audio(CONFIG.musicUrl);
  audioEl.loop = true;
  audioEl.preload = "none";
  audioEl.volume = 0.5;

  const btn = $("#musicBtn");
  btn.style.display = "flex";

  btn.addEventListener("click", async () => {
    try {
      if (audioEl.paused) {
        await audioEl.play();
        btn.classList.add("active");
        btn.querySelector("svg").classList.add("spin");
      } else {
        audioEl.pause();
        btn.classList.remove("active");
        btn.querySelector("svg").classList.remove("spin");
      }
    } catch (err) {
      showToast("پخش موسیقی ممکن نشد 😕");
    }
  });
}


/* ============================================================
   بخش ۷: دکمه صدا (فعال/غیرفعال)
   ============================================================ */
function setupSoundButton() {
  const btn = $("#soundBtn");
  const onIcon = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H2v6h4l5 4V5z"/>
      <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
      <path d="M19 5a9 9 0 0 1 0 14"/>
    </svg>`;
  const offIcon = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H2v6h4l5 4V5z"/>
      <path d="M22 9l-6 6"/>
      <path d="M16 9l6 6"/>
    </svg>`;

  btn.innerHTML = Audio3D.enabled ? onIcon : offIcon;
  btn.classList.toggle("muted", !Audio3D.enabled);

  btn.addEventListener("click", () => {
    Audio3D.enabled = !Audio3D.enabled;
    if (Audio3D.enabled) {
      Audio3D.resume();
      Audio3D.setVolume(CONFIG.sound3D.volume);
      btn.innerHTML = onIcon;
      btn.classList.remove("muted");
      Audio3D.click();  // بازخورد صوتی
    } else {
      if (Audio3D.master) {
        Audio3D.master.gain.setTargetAtTime(
          0, Audio3D.ctx.currentTime, 0.05
        );
      }
      btn.innerHTML = offIcon;
      btn.classList.add("muted");
    }
  });
}


/* ============================================================
   بخش ۸: سیستم ذرات
   ============================================================ */
const canvas = $("#fx");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
let particles = [];
let ambientTimer = null;

function resizeCanvas() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", () => resizeCanvas(), { passive: true });

function heartPath(x, y, size) {
  const top = y - size * 0.32;
  ctx.beginPath();
  ctx.moveTo(x, y + size * 0.72);
  ctx.bezierCurveTo(x + size, y, x + size * 0.52, top - size * 0.62, x, top);
  ctx.bezierCurveTo(x - size * 0.52, top - size * 0.62, x - size, y, x, y + size * 0.72);
  ctx.closePath();
}

function starPath(x, y, size) {
  const s = size;
  ctx.beginPath();
  ctx.moveTo(x, y - s);
  ctx.quadraticCurveTo(x + s * 0.18, y - s * 0.18, x + s, y);
  ctx.quadraticCurveTo(x + s * 0.18, y + s * 0.18, x, y + s);
  ctx.quadraticCurveTo(x - s * 0.18, y + s * 0.18, x - s, y);
  ctx.quadraticCurveTo(x - s * 0.18, y - s * 0.18, x, y - s);
  ctx.closePath();
}

function spawnAmbient() {
  if (document.hidden) return;
  if (particles.filter(p => p.type !== "confetti").length > 70) return;

  const isHeart = Math.random() < 0.65;
  const colors = [
    CONFIG.themeColors.primary,
    CONFIG.themeColors.secondary,
    CONFIG.themeColors.accent
  ];

  particles.push({
    type: isHeart ? "heart" : "star",
    x: Math.random() * W,
    y: H + 24,
    size: 5 + Math.random() * 11,
    vx: (Math.random() - 0.5) * 0.35,
    vy: -(0.25 + Math.random() * 0.65),
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 0.018,
    alpha: 0.10 + Math.random() * 0.32,
    color: colors[Math.floor(Math.random() * colors.length)],
    wobble: Math.random() * Math.PI * 2
  });
}

function burstConfetti(count = 130) {
  const colors = [
    CONFIG.themeColors.primary,
    CONFIG.themeColors.secondary,
    CONFIG.themeColors.accent,
    "#ffffff",
    "#7fe7d4"
  ];

  for (let i = 0; i < count; i++) {
    const fromLeft = i % 2 === 0;
    particles.push({
      type: "confetti",
      x: fromLeft ? -20 : W + 20,
      y: H * (0.25 + Math.random() * 0.5),
      vx: (fromLeft ? 1 : -1) * (2.6 + Math.random() * 4.2),
      vy: -(2.4 + Math.random() * 4.6),
      w: 6 + Math.random() * 8,
      h: 9 + Math.random() * 12,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.34,
      color: colors[Math.floor(Math.random() * colors.length)],
      gravity: 0.11 + Math.random() * 0.07,
      life: 0,
      ttl: 150 + Math.random() * 130
    });
  }
}

function animate() {
  ctx.clearRect(0, 0, W, H);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    if (p.type === "confetti") {
      p.life++;
      p.vy += p.gravity;
      p.vx *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;

      const fade = Math.max(0, 1 - p.life / p.ttl);
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();

      if (p.life > p.ttl || p.y > H + 60) particles.splice(i, 1);
    } else {
      p.wobble += 0.016;
      p.x += p.vx + Math.sin(p.wobble) * 0.32;
      p.y += p.vy;
      p.rot += p.vr;

      const fadeTop = Math.min(1, p.y / (H * 0.42));
      ctx.save();
      ctx.globalAlpha = p.alpha * fadeTop;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;

      if (p.type === "heart") heartPath(0, 0, p.size);
      else starPath(0, 0, p.size);

      ctx.fill();
      ctx.restore();

      if (p.y < -60) particles.splice(i, 1);
    }
  }
  requestAnimationFrame(animate);
}

function startAmbient() {
  clearInterval(ambientTimer);
  ambientTimer = setInterval(spawnAmbient, state.reducedMotion ? 480 : 230);
}

function initEntry() {
  const startBtn = $("#startBtn");

  // بازخورد صوتی کلیک برای همهٔ دکمه‌ها
  document.addEventListener("pointerdown", e => {
    const btn = e.target.closest("button, .btn, .reason, .envelope, .gift-box");
    if (!btn) return;
    Audio3D.resume();
    // فقط یک کلیک ملایم برای همه‌چیز (دکمه‌های خاص افکت مخصوص دارند)
    if (!btn.classList.contains("game-heart") &&
        !btn.classList.contains("gift-box") &&
        !btn.classList.contains("envelope") &&
        !btn.classList.contains("reason")) {
      Audio3D.click(e.clientX, e.clientY);
    }
  }, { passive: true });

  startBtn.addEventListener("click", () => {
    Audio3D.resume();

    // شروع موسیقی در اولین تعامل
    if (audioEl && audioEl.paused) {
      audioEl.play().then(() => {
        const btn = $("#musicBtn");
        btn.classList.add("active");
        btn.querySelector("svg").classList.add("spin");
      }).catch(() => {});
    }

    if (state.name) {
      goTo("welcome");
      runWelcome();
    } else {
      goTo("name");
      setTimeout(() => $("#nameInput").focus(), 650);
    }
  });
}

/* ---------- ۱۰.۲) صفحه اسم ---------- */
function initNameScreen() {
  const input = $("#nameInput");
  const wrap  = $("#nameWrap");
  const btn   = $("#nameSubmit");

  const submit = () => {
    const value = input.value.trim();

    if (!value || value.length < 2) {
      wrap.classList.remove("shake");
      void wrap.offsetWidth;
      wrap.classList.add("shake");
      input.focus();
      // صدای «نه» ملایم
      Audio3D._tone({
        freq: 260, freqEnd: 180, dur: 0.15, type: "sine",
        gain: 0.1, attack: 0.005, release: 0.1
      });
      return;
    }

    state.name = value;

    if (CONFIG.useLocalStorage) {
      try { localStorage.setItem(STORAGE_KEY, value); } catch (e) {}
    }

    // زنگ خوش‌آمد
    Audio3D.pageChime();

    goTo("welcome");
    runWelcome();
  };

  btn.addEventListener("click", submit);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") submit();
  });
}

/* ---------- ۱۰.۳) خوش‌آمد ---------- */
let welcomeRunning = false;

async function runWelcome() {
  if (welcomeRunning) return;
  welcomeRunning = true;

  const host = $("#welcomeLines");
  const nextWrap = $("#welcomeNextWrap");

  host.innerHTML = "";
  nextWrap.classList.remove("show");

  const lines = (CONFIG.welcomeMessages || []).map(t);

  for (let i = 0; i < lines.length; i++) {
    const p = el("p", "welcome-line");
    host.appendChild(p);
    await typeText(p, lines[i], i === 0 ? 62 : 36);
    await sleep(420);
  }

  await sleep(280);
  nextWrap.classList.add("show");

  setTimeout(() => { welcomeRunning = false; }, 400);
}

/** تایپ متن با صدای سه‌بعدی ملایم */
async function typeText(node, text, speed = 40) {
  node.textContent = "";
  node.classList.add("cursor");
  let tickCounter = 0;

  for (let i = 0; i < text.length; i++) {
    node.textContent += text[i];

    // صدای تایپ: هر ۲ کاراکتر یک‌بار، بسیار ملایم
    if (Audio3D.enabled && CONFIG.sound3D.typingSound && text[i] !== " ") {
      tickCounter++;
      if (tickCounter % 2 === 0) Audio3D.typeTick();
    }

    await sleep(speed + (Math.random() * 26 - 12));
  }
  node.classList.remove("cursor");
}

function initWelcome() {
  $("#welcomeNext").addEventListener("click", () => {
    state.currentCard = 0;

function updateProgress() {

  $("#progressFill").style.width = pct + "%";
}

function showCard(i) {

    goTo("final");

  state.currentCard = i;

/* ---------- کارت ۱: دلایل ---------- */
function cardReasons() {
  const card = el("div", "card glass");
  card.innerHTML = `
    <h2 class="card-title">چند تا چیز که تو رو خاص می‌کنه</h2>
    <p class="card-hint">روی هر کاغذ بزن تا باز بشه 👆</p>
    <div class="reasons-grid" id="reasonsGrid"></div>
    <div class="btn-row fade-up" id="reasonsNext">
      <button class="btn" type="button">ادامه</button>
    </div>
  `;

  const grid = card.querySelector("#reasonsGrid");
  const nextWrap = card.querySelector("#reasonsNext");
  const reasons = CONFIG.reasons || [];
  let opened = 0;

  reasons.forEach((text, idx) => {
    const item = el("button", "reason");
    item.type = "button";
    item.setAttribute("aria-label", "باز کردن کارت " + (idx + 1));
    item.innerHTML = `
      <div class="reason-inner">
        <div class="reason-face reason-front">?</div>
        <div class="reason-face reason-back">${t(text)}</div>
      </div>
    `;

    item.addEventListener("click", ev => {
      if (item.classList.contains("flipped")) return;
      item.classList.add("flipped");

      // صدای چرخش کارت، در موقعیت دقیق کارت
      Audio3D.flip(ev.clientX, ev.clientY);

      opened++;
      if (opened === reasons.length) {
        setTimeout(() => nextWrap.classList.add("show"), 420);
      }

/* ---------- کارت ۳: چالش ---------- */
const HEART_SVG = `
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M12 21s-7.5-4.6-9.6-9.2C.7 8.3 2.6 4.5 6.3 4.5c2.1 0 3.6 1.2 4.4 2.4.8-1.2 2.3-2.4 4.4-2.4 3.7 0 5.6 3.8 3.9 7.3C19.5 16.4 12 21 12 21z"/>
  </svg>
`;

function cardGame() {
  const txt = CONFIG.miniGameText || {};
  const NEED = 5;

  const card = el("div", "card glass");
  card.innerHTML = `
    <h2 class="card-title">${t(txt.title || "یک چالش کوچک")}</h2>
    <p class="card-hint">${t(txt.hint || "")}</p>
    <div class="game-area" id="gameArea"></div>
    <div class="game-status">
      <span>${t(txt.progress || "پیشرفت")}</span>
      <span class="game-counter"><span id="caughtCount">0</span> / ${NEED}</span>
    </div>
    <div class="btn-row fade-up" id="gameNext">
      <button class="btn" type="button">ادامه</button>
    </div>
  `;

  const area     = card.querySelector("#gameArea");
  const countEl  = card.querySelector("#caughtCount");
  const nextWrap = card.querySelector("#gameNext");

  let caught = 0;
  let spawnTimer = null;
  let finished = false;
  const liveHearts = new Set();

  function spawnHeart() {
    if (finished) return;
    if (liveHearts.size > 4) return;

    const size = window.innerWidth < 480 ? 46 : 54;
    const maxX = Math.max(0, area.clientWidth  - size);
    const maxY = Math.max(0, area.clientHeight - size);

    const btn = el("button", "game-heart");
    btn.type = "button";
    btn.style.width  = size + "px";
    btn.style.height = size + "px";
    btn.style.left = Math.random() * maxX + "px";
    btn.style.top  = Math.random() * maxY + "px";
    btn.innerHTML = HEART_SVG;
    btn.setAttribute("aria-label", "گرفتن قلب");

    const removeHeart = () => {
      liveHearts.delete(btn);
      if (btn.parentNode) btn.parentNode.removeChild(btn);
    };

    btn.addEventListener("click", ev => {
      ev.preventDefault();
      if (btn.dataset.done === "1") return;
      btn.dataset.done = "1";

      caught++;
      countEl.textContent = String(caught);
      btn.classList.add("popped");

      // 🎧 صدای پاپ در موقعیت سه‌بعدی دقیقِ قلب
      Audio3D.heartPop(ev.clientX, ev.clientY);

      setTimeout(removeHeart, 360);

      if (caught >= NEED && !finished) {
        finished = true;
        clearInterval(spawnTimer);
        liveHearts.forEach(h => {
          h.classList.add("gone");
          setTimeout(() => { if (h.parentNode) h.parentNode.removeChild(h); }, 420);
        });
        liveHearts.clear();

        // 🎧 جشن کوچک
        setTimeout(() => Audio3D.celebration(), 180);

        const successP = el("p", "card-hint fade-up",
          `<strong style="color:var(--accent)">${t(txt.success || "آفرین!")}</strong>`);
        area.parentNode.insertBefore(successP, nextWrap);
        requestAnimationFrame(() => successP.classList.add("show"));

        setTimeout(() => nextWrap.classList.add("show"), 500);
      }
    });

    area.appendChild(btn);
    liveHearts.add(btn);

    setTimeout(() => {
      if (btn.dataset.done === "1") return;
      if (!btn.parentNode) return;
      btn.classList.add("gone");
      setTimeout(removeHeart, 420);
    }, 3200);
  }

  spawnHeart();
  spawnTimer = setInterval(spawnHeart, state.reducedMotion ? 900 : 720);

  const observer = new MutationObserver(() => {
    if (!document.body.contains(card)) {
      clearInterval(spawnTimer);
      observer.disconnect();
    }
  });
  observer.observe($("#cardHost"), { childList: true });

  nextWrap.querySelector(".btn").addEventListener("click", () => {
    clearInterval(spawnTimer);
    nextCard();
  });

  return card;
}

function runFinal() {
  if (finalStarted) return;
  finalStarted = true;

  $("#finalTitle").textContent = t("ممنون که تا آخر دیدی، {name} جان 🌸");

  const msg = t(CONFIG.finalMessage || "");
  $("#finalText").innerHTML = msg.replace(/\n/g, "<br>");

    `با احترام و محبت — <strong>${t(CONFIG.senderName || "")}</strong>`;

  Audio3D.celebration();

  burstConfetti(120);
  setTimeout(() => {
    burstConfetti(80);
    Audio3D.whoosh();
  }, 700);

function initFinal() {
  $("#replayBtn").addEventListener("click", () => {
    finalStarted = false;
    state.currentCard = 0;
    state.caughtHearts = 0;
    particles = particles.filter(p => p.type !== "confetti");

    startAmbient();
    Audio3D.pageChime();
    goTo("entry");
  });

  $("#replyBtn").addEventListener("click", async () => {
    const replyText =
      `سلام ${CONFIG.senderName || ""} عزیز 🌸\n` +
      `سورپرایزت رو دیدم و کلی ذوق کردم.\n` +
      `ممنون که به یادم بودی ✨\n` +
      `— ${state.name || ""}`;

    const link = (CONFIG.socialOrReplyLink || "").trim();

    if (link) {
      if (link.startsWith("mailto:")) {
        const sep = link.includes("?") ? "&" : "?";
        window.location.href = link + sep + "body=" + encodeURIComponent(replyText);
      } else {
        window.open(link, "_blank", "noopener,noreferrer");
      }
      return;
    }

    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(replyText);
      } else {
        const ta = document.createElement("textarea");
        ta.value = replyText;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      showToast("متن پاسخ کپی شد ✨ حالا می‌تونی بفرستیش");
    } catch (err) {
      showToast("کپی نشد؛ می‌تونی دستی بنویسی 🌷");
    }
  });
}

   بخش ۱۳: راه‌اندازی نهایی

function init() {
  applyTheme();
  resizeCanvas();
  requestAnimationFrame(animate);
  startAmbient();

  // صدا فقط پس از اولین تعامل واقعی کاربر راه می‌افتد (سیاست مرورگرها)
  const unlockAudio = () => {
    Audio3D.resume();
    window.removeEventListener("pointerdown", unlockAudio);
    window.removeEventListener("keydown", unlockAudio);
    window.removeEventListener("touchstart", unlockAudio);
  };
  window.addEventListener("pointerdown", unlockAudio, { passive: true });
  window.addEventListener("keydown", unlockAudio);
  window.addEventListener("touchstart", unlockAudio, { passive: true });

  // اگر تب مخفی شد، صدای محیط را کم‌کنیم
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && Audio3D.master) {
      Audio3D.master.gain.setTargetAtTime(0, Audio3D.ctx.currentTime, 0.2);
    } else if (Audio3D.enabled && Audio3D.master) {
      Audio3D.master.gain.setTargetAtTime(
        Audio3D.volume, Audio3D.ctx.currentTime, 0.2
      );
    }
  });

  setupMusic();
  setupSoundButton();
  initEntry();
  initNameScreen();
  initWelcome();
  initFinal();

  if (CONFIG.herName && CONFIG.herName.trim()) {
    state.name = CONFIG.herName.trim();
  } else if (CONFIG.useLocalStorage) {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved && saved.trim()) state.name = saved.trim();
    } catch (e) {}
  }

  goTo("entry");
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>

</body>
</html>
